apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  labels:
    app: pgvector
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the RWO volume can only be mounted by one pod,
  # so the old pod must terminate before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      # postgres/pgvector's official image runs as the `postgres` user (uid/gid 999).
      # fsGroup makes the mounted PVC group-writable by that uid so Postgres can
      # write to PGDATA without ever needing root.
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          # Custom image: Postgres 17 + pgvector + pg_textsearch, built from the
          # Dockerfile in this folder. Replace with the image name you pushed.
          image: wawancenggoro/pgvector-textsearch:pg17
          imagePullPolicy: IfNotPresent
          # pg_textsearch must be loaded at server start, so preload its library.
          args: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: pgvector-secret
          env:
            # Keep the data in a subdirectory so a volume "lost+found" folder
            # does not clash with Postgres' empty-dir check on first boot.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgvector-data
        - name: init
          configMap:
            name: pgvector-init
