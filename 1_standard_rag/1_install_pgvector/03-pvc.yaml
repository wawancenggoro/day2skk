# Persistent storage for the database files, so data survives pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: storage-nvme-c2
  volumeMode: Filesystem
