# Database credentials.
# CHANGE THESE VALUES before applying, especially POSTGRES_PASSWORD.
# stringData lets you write plain text; Kubernetes stores it base64-encoded.
apiVersion: v1
kind: Secret
metadata:
  name: pgvector-secret
type: Opaque
stringData:
  POSTGRES_USER: raguser
  POSTGRES_PASSWORD: "change-me-please"
  POSTGRES_DB: ragdb
