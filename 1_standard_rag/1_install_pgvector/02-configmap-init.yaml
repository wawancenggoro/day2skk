# SQL that runs ONCE, the first time the database is initialised (empty data dir).
# The pgvector image executes every file in /docker-entrypoint-initdb.d/ on first boot,
# so this enables the `vector` extension automatically in POSTGRES_DB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgvector-init
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_textsearch;
