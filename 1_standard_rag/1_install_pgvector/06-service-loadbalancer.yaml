# OPTIONAL: expose Postgres OUTSIDE the cluster (e.g. to reach it from a laptop
# running the RAG notebooks) via a Cloudeka load balancer with a public IP.
#
# Apply this ONLY if you need external access AND you understand the exposure.
# Exposing a database to the internet is risky: use a strong password (01-secret.yaml)
# and, if possible, restrict access with loadBalancerSourceRanges below.
#
# Prefer `kubectl port-forward` (see README) for temporary local access instead.
apiVersion: v1
kind: Service
metadata:
  name: pgvector-lb
  labels:
    app: pgvector
spec:
  type: LoadBalancer
  selector:
    app: pgvector
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  # Restrict who can connect (recommended). Replace with your office/VPN CIDR:
  # loadBalancerSourceRanges:
  #   - 203.0.113.0/24
